name: Build release packages

on:
  push:
    tags:
      - "v1.0"
      - "v2.0"
      - "v2.1"
      - "v2.2"
      - "v2.3"
      - "v3.0"
      - "v3.1"
      - "v3.2"
      - "trainer-v0.2.0"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Public release label"
        required: true
        type: choice
        options: ["v1.0", "v2.0", "v2.1", "v2.2", "v2.3", "v3.0", "v3.1", "v3.2", "trainer-v0.2.0"]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select release
        id: release
        shell: bash
        run: echo "ref=${{ inputs.release_ref || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Build selected release
        shell: bash
        run: |
          if [[ "${{ steps.release.outputs.ref }}" == trainer-* ]]; then
            python development/scripts/build_trainer_release.py --ref "${{ steps.release.outputs.ref }}" --output dist/release-assets
          else
            python development/scripts/build_release.py --ref "${{ steps.release.outputs.ref }}" --output dist/release-assets
          fi
      - run: python development/scripts/privacy_scan_history.py --archives dist
      - uses: actions/upload-artifact@v4
        with:
          name: journal-cover-letter-${{ steps.release.outputs.ref }}
          path: dist/release-assets/*
