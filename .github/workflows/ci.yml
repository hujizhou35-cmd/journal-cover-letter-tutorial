name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "development[test]"
      - run: python development/scripts/validate_structure.py
      - run: python development/scripts/privacy_scan.py
      - run: python development/scripts/privacy_scan_history.py
      - run: pytest -q development/tests
