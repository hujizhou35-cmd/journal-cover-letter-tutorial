name: Bug report
description: Report incorrect workflow, script, packaging, or documentation behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not attach unpublished manuscripts, active submission correspondence, personal details, or confidential journal material."
  - type: dropdown
    id: version
    attributes:
      label: Version
      options: ["v2.1", "v2.0", "v1.0", "main"]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Use synthetic or safely anonymized details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal, confidential, and unpublished submission information.
          required: true
